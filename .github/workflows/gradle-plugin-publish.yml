name: Publish Gradle plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved Gradle plugin version, without v'
        required: true
        type: string
      confirmation:
        description: 'Type PUBLISH to release to the Gradle Plugin Portal'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: gradle-plugin-publish
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify requested tag, tested main and approval protection
        id: source
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' || "$CONFIRMATION" != 'PUBLISH' || ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$VERSION" == '0.0.0' ]]; then
            echo 'Dispatch from main with numeric version and PUBLISH confirmation' >&2
            exit 1
          fi
          tag="gradle-plugin/v${VERSION}"
          git fetch --no-tags origin "refs/tags/${tag}"
          if [[ "$(git cat-file -t FETCH_HEAD)" != 'tag' ]]; then
            echo 'Gradle plugin release requires an annotated tag' >&2
            exit 1
          fi
          source_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$source_sha" != "$main_sha" || "$source_sha" != "$(git rev-parse HEAD)" ]]; then
            echo 'Release tag must point to the current tested main commit' >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/environments/gradle-plugin" |
            jq -e '.can_admins_bypass == false and ([.protection_rules[] | select(.type == "required_reviewers" and (.reviewers | length) > 0)] | length) > 0' >/dev/null || {
              echo 'gradle-plugin environment must require reviewers and disable admin bypass' >&2
              exit 1
            }
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=${source_sha}&per_page=15" |
            jq -e --arg sha "$source_sha" '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")] | length > 0' >/dev/null || {
              echo 'No successful main CI run exists for the tagged commit' >&2
              exit 1
            }
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.14.6'
          cache-provider: basic
      - name: Verify tests, coverage and Portal publication metadata without uploading
        env:
          DISTROPLANE_GRADLE_PLUGIN_VERSION: ${{ inputs.version }}
        run: gradle -p gradle-plugin clean check publishPlugins --validate-only --no-daemon

  publish:
    name: Publish approved Gradle plugin
    needs: preflight
    environment:
      name: gradle-plugin
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reverify immutable release source after approval
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          tag="gradle-plugin/v${VERSION}"
          git fetch --no-tags origin "refs/tags/${tag}"
          test "$(git cat-file -t FETCH_HEAD)" = tag
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_SHA"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.14.6'
          cache-provider: basic
      - name: Publish immutable version to Gradle Plugin Portal
        shell: bash
        env:
          DISTROPLANE_GRADLE_PLUGIN_VERSION: ${{ inputs.version }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$GRADLE_PUBLISH_KEY" || -z "$GRADLE_PUBLISH_SECRET" ]]; then
            echo 'Gradle Plugin Portal publishing credentials are not configured' >&2
            exit 1
          fi
          gradle -p gradle-plugin publishPlugins --no-daemon
      - name: Record submission
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          {
            echo "### Gradle plugin ${VERSION} submitted"
            echo "Source commit: \`${SOURCE_SHA}\`"
            echo 'Plugin Portal review may be required before the release becomes public.'
          } >> "$GITHUB_STEP_SUMMARY"
