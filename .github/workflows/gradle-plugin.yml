name: Gradle plugin

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: gradle-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Gradle plugin (${{ matrix.os }}, JDK ${{ matrix.java }}, Gradle ${{ matrix.gradle }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, java: '17', gradle: '8.14.6' }
          - { os: ubuntu-latest, java: '21', gradle: '9.8.2' }
          - { os: macos-latest, java: '17', gradle: '8.14.6' }
          - { os: windows-latest, java: '21', gradle: '9.8.2' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ matrix.gradle }}
          cache-provider: basic
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build controlled native fixture
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $native = Join-Path $env:RUNNER_TEMP "distroplane-gradle-fixture$extension"
          go build -o $native ./maven-plugin/it/fixture-cli/main.go
          if ($LASTEXITCODE -ne 0) { throw 'Native fixture build failed' }
          "DISTROPLANE_FIXTURE_BINARY=$native" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Verify plugin tests
        run: gradle -p gradle-plugin clean test --no-daemon --stacktrace
      - name: Enforce strict line and branch coverage
        if: runner.os == 'Linux'
        run: gradle -p gradle-plugin jacocoTestCoverageVerification --no-daemon --stacktrace
