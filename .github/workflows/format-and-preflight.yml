name: Source preflight
on:
  push:
    branches: [feat/diagnostic-health-checks]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Format and save changed Go sources
        run: |
          gofmt -w cmd/distroplane/doctor.go cmd/distroplane/doctor_test.go cmd/distroplane/doctor_edge_test.go cmd/distroplane/diagnostics.go cmd/distroplane/diagnostics_test.go cmd/distroplane/signals_unix.go cmd/distroplane/signals_windows.go cmd/distroplane/signals_unix_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cmd/distroplane/
            git commit -m "style: format health diagnostic sources"
            git push
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Coverage
        run: ./scripts/check-coverage.sh
      - name: Race check
        run: go test -race ./cmd/distroplane -run 'TestDoctor|TestDiagnostic|TestTerminationSignal' -count=1
