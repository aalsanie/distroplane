name: GitHub Action smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: action-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan and handoff (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build smoke fixture
        id: fixture
        shell: pwsh
        run: ./action/smoke-fixture.ps1
      - name: Plan with local action
        id: plan
        uses: ./
        with:
          command: plan
          binary: ${{ steps.fixture.outputs.cli }}
          config: ${{ steps.fixture.outputs.config }}
          state-dir: state
          upload-plan: 'true'
          plan-artifact-name: action-plan-${{ matrix.os }}
      - name: Verify plan outputs
        shell: pwsh
        env:
          PLAN_ID: ${{ steps.plan.outputs.plan-id }}
          PLAN_PATH: ${{ steps.plan.outputs.plan-path }}
          EXIT_CODE: ${{ steps.plan.outputs.exit-code }}
          RESULT_JSON: ${{ steps.plan.outputs.result-json }}
          PLAN_ARTIFACT_ID: ${{ steps.plan.outputs.plan-artifact-id }}
        run: |
          if (-not $env:PLAN_ID) { throw 'plan-id output is empty' }
          if (-not (Test-Path -LiteralPath $env:PLAN_PATH -PathType Leaf)) { throw 'plan-path output is missing' }
          if ($env:EXIT_CODE -ne '0') { throw "unexpected plan exit code $env:EXIT_CODE" }
          if (-not $env:PLAN_ARTIFACT_ID) { throw 'plan artifact ID is empty' }
          $result = $env:RESULT_JSON | ConvertFrom-Json
          if ($result.planId -ne $env:PLAN_ID -or $result.targets -ne 1 -or $result.operations -ne 1) {
            throw 'plan result outputs are inconsistent'
          }
      - name: Stage verified provider snapshots for cross-job recovery
        shell: pwsh
        env:
          CONFIG_PATH: ${{ steps.fixture.outputs.config }}
        run: |
          $root = Split-Path -Parent $env:CONFIG_PATH
          $providers = Join-Path $root '.distroplane/providers'
          if (-not (Test-Path -LiteralPath $providers -PathType Container)) {
            throw 'retained provider directory is missing after plan creation'
          }
          $handoff = Join-Path $root 'handoff'
          New-Item -ItemType Directory -Path $handoff -Force | Out-Null
          Copy-Item -LiteralPath $providers -Destination $handoff -Recurse -Force
          if (-not (Test-Path -LiteralPath (Join-Path $handoff 'providers') -PathType Container)) {
            throw 'retained provider snapshot handoff was not staged'
          }
      - name: Upload runtime handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-runtime-${{ matrix.os }}
          path: |
            smoke
            !smoke/state/plans/**
          if-no-files-found: error

  apply:
    name: Apply and evidence (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download immutable plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-plan-${{ matrix.os }}
          path: smoke/action-plan
      - name: Download runtime handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-runtime-${{ matrix.os }}
          path: smoke
      - name: Restore handoff
        id: fixture
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $cli = (Resolve-Path "smoke/bin/distroplane$extension").Path
          $provider = (Resolve-Path "smoke/bin/distroplane-provider-fake$extension").Path
          if (-not $IsWindows) {
            & chmod +x $cli $provider
            if ($LASTEXITCODE -ne 0) { throw 'failed to restore executable permissions' }
          }
          $configPath = (Resolve-Path 'smoke/distroplane.json').Path
          $project = Split-Path -Parent $configPath
          $handoff = Join-Path $project 'handoff/providers'
          if (-not (Test-Path -LiteralPath $handoff -PathType Container)) {
            throw 'cross-job handoff is missing the original provider snapshots'
          }
          $stateRoot = Join-Path $project '.distroplane'
          New-Item -ItemType Directory -Path $stateRoot -Force | Out-Null
          Copy-Item -LiteralPath $handoff -Destination $stateRoot -Recurse -Force
          $snapshotRoot = Join-Path $stateRoot 'providers'
          $receipts = @(Get-ChildItem -LiteralPath $snapshotRoot -Recurse -File -Filter 'binding.json')
          if ($receipts.Count -lt 1) { throw 'provider snapshot receipt was not preserved across jobs' }
          if (-not $IsWindows) {
            & chmod 700 $snapshotRoot
            Get-ChildItem -LiteralPath $snapshotRoot -Recurse -Directory | ForEach-Object {
              & chmod 700 $_.FullName
            }
            Get-ChildItem -LiteralPath $snapshotRoot -Recurse -File | ForEach-Object {
              if ($_.Name -eq 'binding.json') {
                & chmod 600 $_.FullName
              } else {
                & chmod 500 $_.FullName
              }
            }
            if ($LASTEXITCODE -ne 0) { throw 'failed to restore provider snapshot permissions' }
          }
          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          $config.targets[0].provider.executable = $provider
          $config | ConvertTo-Json -Depth 12 -Compress | Set-Content -LiteralPath $configPath -Encoding utf8NoBOM
          $plan = Get-ChildItem -LiteralPath 'smoke/action-plan' -Recurse -File -Filter '*.json'
          if ($plan.Count -ne 1) { throw 'expected exactly one Action-uploaded plan' }
          "cli=$cli" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "config=$configPath" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "plan=$($plan[0].FullName)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
      - name: Apply with local action
        id: apply
        uses: ./
        with:
          command: apply
          binary: ${{ steps.fixture.outputs.cli }}
          config: ${{ steps.fixture.outputs.config }}
          plan: ${{ steps.fixture.outputs.plan }}
          journal: smoke/run.journal
          run-id: run-action-smoke
          evidence-path: smoke/evidence.json
          upload-evidence: 'true'
          evidence-artifact-name: action-evidence-${{ matrix.os }}
      - name: Verify apply outputs
        shell: pwsh
        env:
          PLAN_ID: ${{ steps.apply.outputs.plan-id }}
          RUN_ID: ${{ steps.apply.outputs.run-id }}
          COMPLETED: ${{ steps.apply.outputs.completed }}
          PENDING: ${{ steps.apply.outputs.pending }}
          EXIT_CODE: ${{ steps.apply.outputs.exit-code }}
          RESULT_JSON: ${{ steps.apply.outputs.result-json }}
          EVIDENCE_PATH: ${{ steps.apply.outputs.evidence-path }}
          EVIDENCE_DIGEST: ${{ steps.apply.outputs.evidence-digest }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.apply.outputs.evidence-artifact-id }}
        run: |
          if (-not $env:PLAN_ID) { throw 'plan-id output is empty' }
          if ($env:RUN_ID -ne 'run-action-smoke') { throw "unexpected run ID $env:RUN_ID" }
          if ($env:COMPLETED -ne 'true' -or $env:PENDING -ne 'false' -or $env:EXIT_CODE -ne '0') {
            throw 'apply did not complete successfully'
          }
          if (-not (Test-Path -LiteralPath $env:EVIDENCE_PATH -PathType Leaf)) { throw 'evidence output is missing' }
          if ($env:EVIDENCE_DIGEST -notmatch '^sha256:[0-9a-f]{64}$') { throw 'invalid evidence digest' }
          if (-not $env:EVIDENCE_ARTIFACT_ID) { throw 'evidence artifact ID is empty' }
          $result = $env:RESULT_JSON | ConvertFrom-Json
          if ($result.targets.Count -ne 1 -or $result.targets[0].state -ne 'PUBLISHED') {
            throw 'unexpected normalized target state'
          }

  reviewed-plan:
    name: Reviewed plan handoff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      plan-id: ${{ steps.plan.outputs.plan-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build reviewed-plan fixture
        id: fixture
        shell: pwsh
        run: ./action/smoke-fixture.ps1 -Root reviewed-smoke -Mode published
      - name: Plan without authorization to publish
        id: plan
        uses: ./
        with:
          command: plan
          binary: ${{ steps.fixture.outputs.cli }}
          config: ${{ steps.fixture.outputs.config }}
          upload-recovery: 'true'
          recovery-artifact-name: reviewed-plan-state
      - name: Check immutable planned identity
        shell: pwsh
        env:
          PLAN_ID: ${{ steps.plan.outputs.plan-id }}
          RUN_ID: ${{ steps.plan.outputs.run-id }}
          RECOVERY_ARTIFACT: ${{ steps.plan.outputs.recovery-artifact-id }}
        run: |
          if (-not $env:PLAN_ID -or $env:RUN_ID -or -not $env:RECOVERY_ARTIFACT) {
            throw 'planning unexpectedly executed or failed to preserve its state'
          }

  reviewed-plan-apply:
    name: Explicit plan-ID approval in another job
    needs: reviewed-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore verified plan and publish only approved identity
        id: publish
        uses: ./
        with:
          command: publish
          binary: reviewed-smoke/bin/distroplane
          config: reviewed-smoke/distroplane.json
          confirm-plan: ${{ needs.reviewed-plan.outputs.plan-id }}
          restore-recovery: 'true'
          recovery-artifact-name: reviewed-plan-state
      - name: Verify reviewed plan identity and completion
        shell: pwsh
        env:
          EXPECTED_PLAN: ${{ needs.reviewed-plan.outputs.plan-id }}
          PLAN_ID: ${{ steps.publish.outputs.plan-id }}
          RUN_ID: ${{ steps.publish.outputs.run-id }}
          COMPLETED: ${{ steps.publish.outputs.completed }}
          EXIT_CODE: ${{ steps.publish.outputs.exit-code }}
        run: |
          if (-not $env:RUN_ID -or $env:PLAN_ID -ne $env:EXPECTED_PLAN -or
              $env:COMPLETED -ne 'true' -or $env:EXIT_CODE -ne '0') {
            throw 'reviewed plan was not safely approved and completed'
          }

  pending-publish-handoff:
    name: Pending publication and recovery upload (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build pending fixture
        id: fixture
        shell: pwsh
        run: ./action/smoke-fixture.ps1 -Root recovery-smoke -Mode waiting_external
      - name: Publish with explicit approval and retain recoverable state
        id: publish
        uses: ./
        with:
          command: publish
          binary: ${{ steps.fixture.outputs.cli }}
          config: ${{ steps.fixture.outputs.config }}
          approve: 'true'
          upload-recovery: 'true'
          recovery-artifact-name: action-recovery-${{ matrix.os }}
      - name: Verify pending publication
        shell: pwsh
        env:
          PLAN_ID: ${{ steps.publish.outputs.plan-id }}
          RUN_ID: ${{ steps.publish.outputs.run-id }}
          PENDING: ${{ steps.publish.outputs.pending }}
          COMPLETED: ${{ steps.publish.outputs.completed }}
          FAILED: ${{ steps.publish.outputs.failed }}
          REJECTED: ${{ steps.publish.outputs.rejected }}
          RECOVERY_ARTIFACT: ${{ steps.publish.outputs.recovery-artifact-id }}
        run: |
          if (-not $env:PLAN_ID -or -not $env:RUN_ID -or -not $env:RECOVERY_ARTIFACT) {
            throw 'publish omitted durable identity or recovery artifact'
          }
          if ($env:PENDING -ne 'true' -or $env:COMPLETED -ne 'false' -or
              $env:FAILED -ne 'false' -or $env:REJECTED -ne 'false') {
            throw 'pending publish was incorrectly reported as completed or failed'
          }

  pending-resume-handoff:
    name: Verified recovery and resume (${{ matrix.os }})
    needs: pending-publish-handoff
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore and resume the original pending publication
        id: resume
        uses: ./
        with:
          command: resume
          config: recovery-smoke/distroplane.json
          binary: recovery-smoke/bin/distroplane${{ runner.os == 'Windows' && '.exe' || '' }}
          restore-recovery: 'true'
          recovery-artifact-name: action-recovery-${{ matrix.os }}
      - name: Verify same-run recovery
        shell: pwsh
        env:
          PLAN_ID: ${{ steps.resume.outputs.plan-id }}
          RUN_ID: ${{ steps.resume.outputs.run-id }}
          COMPLETED: ${{ steps.resume.outputs.completed }}
          PENDING: ${{ steps.resume.outputs.pending }}
          FAILED: ${{ steps.resume.outputs.failed }}
          EXIT_CODE: ${{ steps.resume.outputs.exit-code }}
          RESULT_JSON: ${{ steps.resume.outputs.result-json }}
        run: |
          if (-not $env:PLAN_ID -or -not $env:RUN_ID -or
              $env:COMPLETED -ne 'true' -or $env:PENDING -ne 'false' -or
              $env:FAILED -ne 'false' -or $env:EXIT_CODE -ne '0') {
            throw 'restored run did not complete successfully'
          }
          $entries = @(Get-ChildItem -LiteralPath 'recovery-smoke/.distroplane/catalog/runs' -File |
              Where-Object { $_.Name -like '*.json' -and $_.Name -notlike '*.backup' })
          if ($entries.Count -ne 1) { throw 'restored catalog has unexpected run count' }
          $record = Get-Content -LiteralPath $entries[0].FullName -Raw | ConvertFrom-Json
          if ($record.planId -ne $env:PLAN_ID -or $record.runId -ne $env:RUN_ID) {
            throw 'resume changed the original durable plan or run identity'
          }
          $output = $env:RESULT_JSON | ConvertFrom-Json
          if ($output.targets.Count -ne 1 -or $output.targets[0].state -ne 'PUBLISHED') {
            throw 'resume did not reconcile the controlled external publication'
          }

  evidence-handoff:
    name: Evidence handoff (${{ matrix.os }})
    needs: apply
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download action evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-evidence-${{ matrix.os }}
          path: evidence
      - name: Verify evidence bundle
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath evidence -Recurse -File -Filter '*.json'
          if ($files.Count -ne 1) { throw 'expected exactly one evidence bundle' }
          $bundle = Get-Content -LiteralPath $files[0].FullName -Raw | ConvertFrom-Json
          if ($bundle.schemaVersion -ne '1' -or $bundle.run.id -ne 'run-action-smoke') {
            throw 'invalid evidence identity'
          }
          if ($bundle.targets.Count -ne 1 -or $bundle.targets[0].state -ne 'PUBLISHED') {
            throw 'evidence does not contain published target state'
          }

  release-install:
    name: Release installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify release installation and provider discovery
        shell: pwsh
        run: ./action/install-smoke.ps1 -Mode success

  release-install-failures:
    name: Release installer rejects ${{ matrix.mode }}
    strategy:
      fail-fast: false
      matrix:
        mode: [checksum, missing, unavailable]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify installer failure
        shell: pwsh
        run: ./action/install-smoke.ps1 -Mode ${{ matrix.mode }} -Root install-smoke-${{ matrix.mode }}

  async-reconcile:
    name: Pending apply and reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build pending fixture
        id: fixture
        shell: pwsh
        run: ./action/smoke-fixture.ps1 -Root async-smoke -Mode waiting_external
      - name: Plan pending target
        id: plan
        uses: ./
        with:
          command: plan
          binary: ${{ steps.fixture.outputs.cli }}
          config: ${{ steps.fixture.outputs.config }}
          state-dir: async-state
      - name: Apply pending target
        id: apply
        uses: ./
        with:
          command: apply
          binary: ${{ steps.fixture.outputs.cli }}
          config: ${{ steps.fixture.outputs.config }}
          plan: ${{ steps.plan.outputs.plan-path }}
          journal: async-smoke/run.journal
          run-id: run-async-smoke
      - name: Verify pending result
        shell: pwsh
        env:
          PENDING: ${{ steps.apply.outputs.pending }}
          EXIT_CODE: ${{ steps.apply.outputs.exit-code }}
        run: |
          if ($env:PENDING -ne 'true' -or $env:EXIT_CODE -ne '4') {
            throw 'apply did not expose the asynchronous pending state'
          }
      - name: Reconcile pending target
        id: reconcile
        uses: ./
        with:
          command: reconcile
          binary: ${{ steps.fixture.outputs.cli }}
          config: ${{ steps.fixture.outputs.config }}
          plan: ${{ steps.plan.outputs.plan-path }}
          journal: async-smoke/run.journal
          evidence-path: async-smoke/evidence.json
      - name: Verify reconciliation
        shell: pwsh
        env:
          COMPLETED: ${{ steps.reconcile.outputs.completed }}
          PENDING: ${{ steps.reconcile.outputs.pending }}
          EXIT_CODE: ${{ steps.reconcile.outputs.exit-code }}
          EVIDENCE_PATH: ${{ steps.reconcile.outputs.evidence-path }}
        run: |
          if ($env:COMPLETED -ne 'true' -or $env:PENDING -ne 'false' -or $env:EXIT_CODE -ne '0') {
            throw 'reconcile did not complete the pending publication'
          }
          if (-not (Test-Path -LiteralPath $env:EVIDENCE_PATH -PathType Leaf)) {
            throw 'reconcile evidence output is missing'
          }

  oidc-environment-absent:
    name: OIDC environment absent
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate npm OIDC binding and audience failure paths
        shell: pwsh
        run: ./action/oidc-smoke.ps1
      - name: Verify absent OIDC request environment
        shell: pwsh
        run: |
          . ./action/oidc.ps1
          try {
            Test-DistroplaneOIDC -Mode required -RequestUrl '' -RequestToken '' | Out-Null
            throw 'OIDC validation unexpectedly accepted an absent request environment'
          } catch {
            if ($_.Exception.Message -notmatch 'OIDC is required but unavailable') {
              throw
            }
          }

  oidc-denied:
    name: OIDC permission denied
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build valid smoke fixture
        id: fixture
        shell: pwsh
        run: ./action/smoke-fixture.ps1
      - name: Require unavailable OIDC
        id: oidc
        continue-on-error: true
        uses: ./
        with:
          command: plan
          binary: ${{ steps.fixture.outputs.cli }}
          config: ${{ steps.fixture.outputs.config }}
          state-dir: oidc-state
          oidc: required
      - name: Verify OIDC permission failure
        shell: pwsh
        env:
          ACTION_OUTCOME: ${{ steps.oidc.outcome }}
        run: |
          if ($env:ACTION_OUTCOME -ne 'failure') {
            throw "OIDC requirement unexpectedly succeeded without id-token: write"
          }

  oidc-granted:
    name: OIDC permission granted
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build valid smoke fixture
        id: fixture
        shell: pwsh
        run: ./action/smoke-fixture.ps1
      - name: Plan with native OIDC enabled
        id: oidc
        uses: ./
        with:
          command: plan
          binary: ${{ steps.fixture.outputs.cli }}
          config: ${{ steps.fixture.outputs.config }}
          state-dir: oidc-state
          oidc: required
      - name: Verify actual GitHub npm OIDC acquisition and CLI-only handoff
        shell: bash
        run: |
          mkdir -p oidc-publish
          cat > oidc-publish/config.json <<'JSON'
          {
            "schemaVersion":"1",
            "release":{"id":"oidc-smoke","artifacts":[{"name":"pkg","source":"file.tgz"}]},
            "targets":[{"id":"npm-release","provider":{"name":"npm"},"configuration":{
              "artifact":"pkg","packagePath":"/tmp/file.tgz","registry":"https://registry.npmjs.org/",
              "authentication":{"mode":"trusted-publishing","credential":"npm-publish"}
            }}]
          }
          JSON
          cat > oidc-publish/cli <<'SH'
          #!/bin/sh
          set -eu
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || exit 21
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || exit 22
          test -n "${DISTROPLANE_ACTION_NPM_OIDC_TOKEN:-}" || exit 23
          case " $* " in
            *" --credential npm-publish=DISTROPLANE_ACTION_NPM_OIDC_TOKEN "*) ;;
            *) exit 24 ;;
          esac
          printf '%s\n' '{"plan":{"planId":"oidc-test-plan","path":"/tmp/oidc-plan.json"},"run":{"runId":"oidc-test-run","completed":true},"journalPath":"/tmp/oidc-journal.json"}'
          SH
          chmod +x oidc-publish/cli
      - name: Execute with a freshly acquired npm-audience JWT
        id: npm-oidc
        uses: ./
        with:
          command: publish
          binary: oidc-publish/cli
          config: oidc-publish/config.json
          approve: 'true'
          oidc: npm
          npm-oidc-ref: npm-publish
      - name: Verify authenticated mock execution
        shell: pwsh
        env:
          PLAN_ID: ${{ steps.npm-oidc.outputs.plan-id }}
          RUN_ID: ${{ steps.npm-oidc.outputs.run-id }}
          COMPLETED: ${{ steps.npm-oidc.outputs.completed }}
          EXIT_CODE: ${{ steps.npm-oidc.outputs.exit-code }}
        run: |
          if ($env:PLAN_ID -ne 'oidc-test-plan' -or $env:RUN_ID -ne 'oidc-test-run' -or
              $env:COMPLETED -ne 'true' -or $env:EXIT_CODE -ne '0') {
            throw 'npm OIDC token was not passed through an isolated CLI credential source'
          }
      - name: Build secret-canary output fixture
        shell: bash
        run: |
          cat > oidc-publish/cli-leak <<'SH'
          #!/bin/sh
          printf '%s\n' "${SENSITIVE_CANARY:-}" >&2
          printf '%s\n' '{"plan":{"planId":"canary-plan","path":"/tmp/plan.json"},"run":{"runId":"canary-run","completed":true}}'
          SH
          chmod +x oidc-publish/cli-leak
      - name: Reject provider stderr that contains a credential value
        id: secret-canary
        continue-on-error: true
        uses: ./
        env:
          SENSITIVE_CANARY: action-sensitive-credential-canary-9c8a2d
        with:
          command: publish
          binary: oidc-publish/cli-leak
          config: oidc-publish/config.json
          approve: 'true'
          credential-mappings: npm-publish=SENSITIVE_CANARY
      - name: Verify sensitive command output was suppressed
        shell: pwsh
        env:
          CANARY_OUTCOME: ${{ steps.secret-canary.outcome }}
          CANARY_RESULT: ${{ steps.secret-canary.outputs.result-json }}
        run: |
          if ($env:CANARY_OUTCOME -ne 'failure' -or $env:CANARY_RESULT -match 'action-sensitive-credential-canary') {
            throw 'sensitive provider stderr escaped the Action output guard'
          }
      - name: Verify OIDC availability
        shell: pwsh
        env:
          OIDC_AVAILABLE: ${{ steps.oidc.outputs.oidc-available }}
          EXIT_CODE: ${{ steps.oidc.outputs.exit-code }}
        run: |
          if ($env:OIDC_AVAILABLE -ne 'true' -or $env:EXIT_CODE -ne '0') {
            throw 'OIDC was not exposed after granting id-token: write'
          }
