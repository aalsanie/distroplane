name: Stage Maven plugin in Central Portal

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved immutable Maven plugin release version (without v)'
        required: true
        type: string
      confirmation:
        description: 'Type STAGE to prepare a validated Central deployment (not public publication)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-stage
  cancel-in-progress: false

jobs:
  stage:
    if: ${{ inputs.confirmation == 'STAGE' }}
    environment: maven-central
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify requested version
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$VERSION" == "0.0.0" ]]; then
            echo 'Release version must be an approved numeric semver' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: maven-plugin/v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify release tag, approval lineage and identity
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git describe --tags --exact-match)" = "maven-plugin/v${VERSION}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          python3 maven-plugin/it/check-publication.py --release-version "$VERSION"
      - name: Verify Central and signing credentials
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          for name in CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD MAVEN_SIGNING_KEY MAVEN_GPG_PASSPHRASE; do
            if [[ -z "${!name:-}" ]]; then
              echo "Maven Central stage requires configured secret $name" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$MAVEN_SIGNING_KEY" | gpg --batch --import >/dev/null 2>&1
          export MAVEN_CENTRAL_SETTINGS="$RUNNER_TEMP/central-settings.xml"
          python3 - <<'PY'
          import os
          from xml.sax.saxutils import escape
          from pathlib import Path
          path = Path(os.environ['MAVEN_CENTRAL_SETTINGS'])
          username=escape(os.environ['CENTRAL_TOKEN_USERNAME'])
          password=escape(os.environ['CENTRAL_TOKEN_PASSWORD'])
          path.write_text('<settings><servers><server><id>central</id><username>'+username+'</username><password>'+password+'</password></server></servers></settings>', encoding='utf-8')
          path.chmod(0o600)
          PY
          # Secrets are never printed or supplied as Maven command-line properties.
          echo "MAVEN_CENTRAL_SETTINGS=$MAVEN_CENTRAL_SETTINGS" >> "$GITHUB_ENV"
      - name: Build signed sources and JavaDoc and stage for validation
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f maven-plugin/pom.xml org.codehaus.mojo:versions-maven-plugin:2.19.1:set "-DnewVersion=$VERSION" -DgenerateBackupPoms=false
          python3 maven-plugin/it/check-publication.py --release-version "$VERSION" --resolved
          commit_date="$(git show -s --format=%cI HEAD)"
          mvn -B -ntp -s "$MAVEN_CENTRAL_SETTINGS" -f maven-plugin/pom.xml -Pcentral-release "-Dproject.build.outputTimestamp=$commit_date" deploy
          echo 'Central bundle submitted for validation. Public publication requires a separate Portal approval.'
