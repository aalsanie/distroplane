name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type REHEARSE to verify assets without publication'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Build and verify Windows MSI packages
    outputs:
      signing_mode: ${{ steps.signing-policy.outputs.mode }}
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Require confirmed rehearsal on main
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        env:
          REHEARSAL_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/main' -or $env:REHEARSAL_CONFIRMATION -cne 'REHEARSE') {
            throw 'Release rehearsal must run on main with REHEARSE confirmation'
          }
      - name: Checkout source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install pinned WiX
        shell: pwsh
        run: |
          dotnet tool install --tool-path "$env:RUNNER_TEMP/wix" wix --version 6.0.0
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
      - name: Require explicit Windows MSI signing policy and matching release tag
        id: signing-policy
        shell: pwsh
        env:
          WINDOWS_MSI_SIGNING_MODE: ${{ vars.WINDOWS_MSI_SIGNING_MODE }}
          MSI_SIGNING_PFX_BASE64: ${{ secrets.MSI_SIGNING_PFX_BASE64 }}
          MSI_SIGNING_PFX_PASSWORD: ${{ secrets.MSI_SIGNING_PFX_PASSWORD }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $sourceRef = if ($env:GITHUB_EVENT_NAME -ceq 'workflow_dispatch') { 'main' } else { "v$version" }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$' -or $env:GITHUB_REF_NAME -cne $sourceRef) {
            throw 'Stable MSI requires matching VERSION and source reference'
          }
          $mode = ./scripts/validate-windows-msi-mode.ps1 -Mode $env:WINDOWS_MSI_SIGNING_MODE
          "mode=$mode" >> $env:GITHUB_OUTPUT
      - name: Build verified release executables and archives
        shell: pwsh
        run: |
          $env:VERSION = (Get-Content VERSION -Raw).Trim()
          $env:COMMIT = (git rev-parse --short=12 HEAD).Trim()
          $env:BUILD_DATE = (git show -s --format=%cI HEAD).Trim()
          ./scripts/build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          go run ./scripts/release-assets.go verify
          if ($LASTEXITCODE -ne 0) { throw 'Release archive integrity failed' }
          "VERSION=$env:VERSION" >> $env:GITHUB_ENV
      - name: Build and verify MSI for both architectures
        shell: pwsh
        env:
          WINDOWS_MSI_SIGNING_MODE: ${{ steps.signing-policy.outputs.mode }}
          MSI_SIGNING_PFX_BASE64: ${{ secrets.MSI_SIGNING_PFX_BASE64 }}
          MSI_SIGNING_PFX_PASSWORD: ${{ secrets.MSI_SIGNING_PFX_PASSWORD }}
        run: |
          $wix = Join-Path $env:RUNNER_TEMP 'wix/wix.exe'
          foreach ($arch in @('amd64','arm64')) {
            $params = @{ Version=$env:VERSION; Architecture=$arch; ReleaseDir='dist'; OutputDir='msi'; WixExe=$wix }
            if ($env:WINDOWS_MSI_SIGNING_MODE -ceq 'pfx') { $params.RequireSignature = $true }
            ./scripts/build-msi.ps1 @params
            $msi = Join-Path 'msi' "distroplane_$($env:VERSION)_windows_$arch.msi"
            $signature = Get-AuthenticodeSignature -LiteralPath $msi
            if ($env:WINDOWS_MSI_SIGNING_MODE -ceq 'unsigned' -and $signature.Status -ne 'NotSigned') {
              throw "Unsigned MSI mode unexpectedly produced a signed installer: $arch"
            }
            if ($env:WINDOWS_MSI_SIGNING_MODE -ceq 'pfx' -and $signature.Status -ne 'Valid') {
              throw "Signed MSI mode requires valid Authenticode: $arch"
            }
          }
      - name: Upload verified MSI and exact source archive evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-windows-msi
          path: |
            msi/*.msi
            dist/distroplane_*_windows_*.zip
          if-no-files-found: error
          retention-days: 2

  stage:
    name: Stage verified release artifacts
    needs: windows-installer
    outputs:
      signing_mode: ${{ needs.windows-installer.outputs.signing_mode }}
    if: ${{ always() && (needs.windows-installer.result == 'success' || (contains(github.ref_name, '-rc.') && needs.windows-installer.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Validate release identity
        id: version
        shell: bash
        env:
          REHEARSAL_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "invalid VERSION: $version" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
            if [[ "${GITHUB_REF}" != 'refs/heads/main' || "${REHEARSAL_CONFIRMATION}" != 'REHEARSE' ]]; then
              echo 'rehearsal requires main and explicit confirmation' >&2
              exit 1
            fi
          elif [[ "${GITHUB_REF_NAME}" != "$tag" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION $version" >&2
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Validate versioned release notes
        shell: bash
        run: ./scripts/check-release-notes.sh

      - name: Require tested main revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          require_success() {
            workflow="$1"
            label="$2"
            response="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=push&branch=main&head_sha=$SHA&per_page=10")"
            count="$(jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length' <<<"$response")"
            if [[ "$count" -lt 1 ]]; then
              echo "$label has no successful main run for $SHA" >&2
              exit 1
            fi
          }
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" != "$SHA" ]]; then
            echo "release source $SHA is not current main $main_sha" >&2
            exit 1
          fi
          require_success "ci.yml" "CI"
          require_success "action-smoke.yml" "GitHub Action smoke"

      - name: Build and verify release assets
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          export COMMIT="${COMMIT:0:12}"
          export BUILD_DATE="$(git show -s --format=%cI HEAD)"
          ./scripts/build.sh
          go run ./scripts/release-assets.go verify
          jq -e --arg version "$VERSION" --arg commit "$COMMIT" \
            '.schemaVersion == "2" and .version == $version and .commit == $commit and (.assets | length == 36)' \
            dist/RELEASE-METADATA.json
          identity="$("./dist/distroplane_${VERSION}_linux_amd64" version --json)"
          jq -e --arg version "$VERSION" --arg commit "$COMMIT" \
            '.version == $version and .commit == $commit' <<<"$identity"
          DISTROPLANE_RELEASE_SMOKE_DIR="$GITHUB_WORKSPACE/dist" \
          DISTROPLANE_RELEASE_SMOKE_VERSION="$VERSION" \
          DISTROPLANE_RELEASE_SMOKE_COMMIT="$COMMIT" \
            go test ./cmd/distroplane -run '^TestReleaseArtifactsExecuteGitProviderThroughCLI$' -count=1
          DISTROPLANE_RELEASE_SMOKE_DIR="$GITHUB_WORKSPACE/dist" \
            go test ./scripts -run '^TestReleaseArchiveNativeExecutables$' -count=1

      - name: Verify fresh native Linux install and fail-closed corruption
        if: ${{ !contains(github.ref_name, '-rc.') }}
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DISTROPLANE_RELEASE_SMOKE_DIR: ${{ github.workspace }}/dist
        run: bash scripts/smoke-linux-install.sh

      - name: Download verified Windows MSI packages
        if: ${{ !contains(github.ref_name, '-rc.') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-windows-msi
          path: windows-msi

      - name: Verify Windows payload parity and include MSI assets in release
        if: ${{ !contains(github.ref_name, '-rc.') }}
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            archive="distroplane_${VERSION}_windows_${arch}.zip"
            msi="distroplane_${VERSION}_windows_${arch}.msi"
            cmp "dist/$archive" "windows-msi/dist/$archive"
            test -s "windows-msi/msi/$msi"
            cp "windows-msi/msi/$msi" "dist/$msi"
          done
          (
            cd dist
            sha256sum "distroplane_${VERSION}_windows_amd64.msi" "distroplane_${VERSION}_windows_arm64.msi" > MSI-SHA256SUMS
            sha256sum --check MSI-SHA256SUMS
          )

      - name: Verify complete release staging inventory
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
          SIGNING_MODE: ${{ needs.windows-installer.outputs.signing_mode }}
        run: |
          set -euo pipefail
          mode="${SIGNING_MODE:-not-applicable}"
          python3 scripts/verify-release-stage.py create --directory dist --version "$VERSION" --commit "${COMMIT:0:12}" --signing-mode "$mode"
          python3 scripts/verify-release-stage.py verify --directory dist --version "$VERSION" --commit "${COMMIT:0:12}" --signing-mode "$mode"

      - name: Upload verified release staging assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 2

  native-install:
    name: Native release install (${{ matrix.os }})
    needs: stage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            native_os: linux
            native_arch: amd64
          - os: ubuntu-24.04-arm
            native_os: linux
            native_arch: arm64
          - os: macos-15-intel
            native_os: darwin
            native_arch: amd64
          - os: macos-15
            native_os: darwin
            native_arch: arm64
          - os: windows-2025
            native_os: windows
            native_arch: amd64
          - os: windows-11-arm
            native_os: windows
            native_arch: arm64
    permissions:
      contents: read
    steps:
      - name: Checkout tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download exact staged release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staged-release-assets
          path: dist
      - name: Execute unpacked release on native runner
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $commit = (git rev-parse --short=12 HEAD).Trim()
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python scripts/smoke-release-native.py --directory dist --version $version --commit $commit --expected-os '${{ matrix.native_os }}' --expected-arch '${{ matrix.native_arch }}'
          if ($LASTEXITCODE -ne 0) { throw 'Native release installability check failed' }

  rehearsal-report:
    name: Record non-publishing release rehearsal
    needs: [stage, native-install]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record verified source and artifacts
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          SIGNING_MODE: ${{ needs.stage.outputs.signing_mode }}
        run: |
          {
            echo '### Release rehearsal passed'
            echo ''
            echo "Source commit: $SOURCE_SHA"
            echo "Windows MSI signing mode: $SIGNING_MODE"
            echo 'Staged assets and all six native release installs verified.'
            echo 'No GitHub release or package-manager update was published.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish verified release
    needs: [stage, native-install]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staged-release-assets
          path: dist
      - name: Require unchanged, complete staged release
        shell: bash
        env:
          SIGNING_MODE: ${{ needs.stage.outputs.signing_mode }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
          commit="$(git rev-parse --short=12 HEAD)"
          mode="${SIGNING_MODE:-not-applicable}"
          python3 scripts/verify-release-stage.py verify --directory dist --version "$version" --commit "$commit" --signing-mode "$mode"
      - name: Attest verified release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*

      - name: Verify signed release provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          for asset in dist/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --source-digest "$SOURCE_COMMIT" \
              --source-ref "$GITHUB_REF" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" >/dev/null
          done

      - name: Publish verified GitHub release atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ github.ref_name }}
          MSI_SIGNING_MODE: ${{ needs.stage.outputs.signing_mode }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists" >&2
            exit 1
          fi
          VERSION="${VERSION#v}"
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          notes_file="docs/releases/v${VERSION}.md"
          if [[ "$MSI_SIGNING_MODE" == "unsigned" ]]; then
            notes_file="$RUNNER_TEMP/unsigned-windows-msi-notes.md"
            cp "docs/releases/v${VERSION}.md" "$notes_file"
            cat >> "$notes_file" <<'EOF'
          
          ## Windows MSI installer trust
          
          The Windows MSI installers in this release are **not Authenticode-signed**. Windows SmartScreen or enterprise policy may warn or block installation. Verify `MSI-SHA256SUMS` and GitHub Actions build provenance before use. Checksums and build attestations do **not** establish a trusted Windows publisher identity.
          EOF
          fi
          # Draft-first publication prevents an incomplete upload from appearing in public feeds.
          gh release create "$TAG" dist/* --draft --verify-tag "${prerelease[@]}" --title "$TAG" --notes-file "$notes_file"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" dist <<'PY'
          import hashlib, json, pathlib, sys
          release = json.loads(pathlib.Path(sys.argv[1]).read_text())
          directory = pathlib.Path(sys.argv[2])
          expected = {p.name: p for p in directory.iterdir() if p.is_file()}
          actual = {a["name"]: a for a in release["assets"]}
          if not release.get("draft") or set(actual) != set(expected):
              raise SystemExit("draft release is incomplete or unexpectedly public")
          for name, file in expected.items():
              asset = actual[name]
              digest = "sha256:" + hashlib.sha256(file.read_bytes()).hexdigest()
              if asset.get("size") != file.stat().st_size or (asset.get("digest") and asset["digest"] != digest):
                  raise SystemExit("uploaded release asset mismatch: " + name)
          PY
          gh release edit "$TAG" --draft=false
          
  public-smoke:
    name: Verify public release (${{ matrix.os }})
    needs: publish
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            native_os: linux
            native_arch: amd64
          - os: ubuntu-24.04-arm
            native_os: linux
            native_arch: arm64
          - os: macos-15-intel
            native_os: darwin
            native_arch: amd64
          - os: macos-15
            native_os: darwin
            native_arch: arm64
          - os: windows-2025
            native_os: windows
            native_arch: amd64
          - os: windows-11-arm
            native_os: windows
            native_arch: arm64
    permissions:
      contents: read
    steps:
      - name: Checkout released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download and verify published native release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Published version mismatch' }
          $os = '${{ matrix.native_os }}'
          $arch = '${{ matrix.native_arch }}'
          $ext = if ($os -ceq 'windows') { '.exe' } else { '' }
          $packageExt = if ($os -ceq 'windows') { '.zip' } else { '.tar.gz' }
          $archive = "distroplane_${version}_${os}_${arch}${packageExt}"
          $assets = @('RELEASE-METADATA.json', 'SHA256SUMS', $archive, "distroplane_${version}_${os}_${arch}${ext}")
          foreach ($provider in @('npm', 'sdkman', 'homebrew', 'winget')) {
            $assets += "distroplane-provider-${provider}_${version}_${os}_${arch}${ext}"
          }
          New-Item -ItemType Directory -Path 'public-dist' | Out-Null
          foreach ($asset in $assets) {
            & gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --dir public-dist --pattern $asset
            if ($LASTEXITCODE -ne 0) { throw "Cannot download published asset: $asset" }
          }
          $checksumLines = @(Get-Content public-dist/SHA256SUMS)
          foreach ($asset in $assets | Where-Object { $_ -ne 'SHA256SUMS' -and $_ -ne 'RELEASE-METADATA.json' }) {
            $pattern = '^([a-f0-9]{64})  ' + [regex]::Escape($asset) + '$'
            $entries = @($checksumLines | Where-Object { $_ -cmatch $pattern })
            if ($entries.Count -ne 1) { throw "Missing or ambiguous published checksum: $asset" }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path 'public-dist' $asset)).Hash.ToLowerInvariant()
            $expected = $entries[0].Substring(0, 64)
            if ($actual -cne $expected) { throw "Published asset checksum mismatch: $asset" }
          }
          & gh attestation verify (Join-Path 'public-dist' $archive) --repo $env:GITHUB_REPOSITORY --source-digest $env:GITHUB_SHA --source-ref $env:GITHUB_REF --signer-workflow "$($env:GITHUB_REPOSITORY)/.github/workflows/release.yml"
          if ($LASTEXITCODE -ne 0) { throw 'Published archive provenance verification failed' }
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          $sourceCommit = $env:GITHUB_SHA.Substring(0, 12)
          & $python scripts/smoke-release-native.py --directory public-dist --version $version --commit $sourceCommit --expected-os $os --expected-arch $arch
          if ($LASTEXITCODE -ne 0) { throw 'Published native release smoke failed' }

  homebrew-tap-update:
    name: Propose verified Homebrew formula update
    needs: [publish, public-smoke]
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate published assets and propose tap PR
        shell: bash
        env:
          SOURCE_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          bash ./scripts/update-homebrew-tap.sh "${GITHUB_REF_NAME#v}"
