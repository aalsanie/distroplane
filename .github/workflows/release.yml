name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "invalid VERSION: $version" >&2
            exit 1
          fi
          previous="$(git show HEAD^:VERSION 2>/dev/null | tr -d '\r\n' || true)"
          publish=true
          if [[ "$previous" == "$version" ]]; then
            publish=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Require Action smoke
        if: ${{ steps.version.outputs.publish == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            response="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/action-smoke.yml/runs?event=push&head_sha=$SHA&per_page=1")"
            status="$(jq -r '.workflow_runs[0].status // "missing"' <<<"$response")"
            conclusion="$(jq -r '.workflow_runs[0].conclusion // ""' <<<"$response")"
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" != "success" ]]; then
                echo "GitHub Action smoke concluded $conclusion" >&2
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Action smoke did not complete successfully" >&2
          exit 1

      - name: Build release assets
        if: ${{ steps.version.outputs.publish == 'true' }}
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          export COMMIT="${COMMIT:0:12}"
          export BUILD_DATE="$(git show -s --format=%cI "${{ github.event.workflow_run.head_sha }}")"
          ./scripts/build.sh
          (cd dist && sha256sum -c SHA256SUMS)
          test -f dist/RELEASE-METADATA.json
          "./dist/distroplane_${VERSION}_linux_amd64" version --json | grep -F "\"version\":\"${VERSION}\"" >/dev/null

      - name: Create tag
        if: ${{ steps.version.outputs.publish == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
            if [[ "$existing" != "$SHA" ]]; then
              echo "tag $TAG already points to $existing" >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
          fi

      - name: Publish GitHub release
        if: ${{ steps.version.outputs.publish == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$TAG" dist/* --verify-tag "${prerelease[@]}" --title "$TAG" --notes "Distroplane $VERSION. Verify downloaded executables against SHA256SUMS; RELEASE-METADATA.json records the source commit and build toolchain."
