name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false

      - name: Validate release identity
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "invalid VERSION: $version" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "$tag" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION $version" >&2
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Validate versioned release notes
        shell: bash
        run: ./scripts/check-release-notes.sh

      - name: Require tested main revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          require_success() {
            workflow="$1"
            label="$2"
            response="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=push&branch=main&head_sha=$SHA&per_page=10")"
            count="$(jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length' <<<"$response")"
            if [[ "$count" -lt 1 ]]; then
              echo "$label has no successful main run for $SHA" >&2
              exit 1
            fi
          }
          require_success "ci.yml" "CI"
          require_success "action-smoke.yml" "GitHub Action smoke"

      - name: Build and verify release assets
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          export COMMIT="${COMMIT:0:12}"
          export BUILD_DATE="$(git show -s --format=%cI HEAD)"
          ./scripts/build.sh
          go run ./scripts/release-assets.go verify
          jq -e --arg version "$VERSION" --arg commit "$COMMIT" \
            '.schemaVersion == "2" and .version == $version and .commit == $commit and (.assets | length == 36)' \
            dist/RELEASE-METADATA.json
          identity="$("./dist/distroplane_${VERSION}_linux_amd64" version --json)"
          jq -e --arg version "$VERSION" --arg commit "$COMMIT" \
            '.version == $version and .commit == $commit' <<<"$identity"
          DISTROPLANE_RELEASE_SMOKE_DIR="$GITHUB_WORKSPACE/dist" \
          DISTROPLANE_RELEASE_SMOKE_VERSION="$VERSION" \
          DISTROPLANE_RELEASE_SMOKE_COMMIT="$COMMIT" \
            go test ./cmd/distroplane -run '^TestReleaseArtifactsExecuteGitProviderThroughCLI$' -count=1
          DISTROPLANE_RELEASE_SMOKE_DIR="$GITHUB_WORKSPACE/dist" \
            go test ./scripts -run '^TestReleaseArchiveNativeExecutables$' -count=1

      - name: Attest verified release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*

      - name: Verify signed release provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          for asset in dist/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --source-digest "$SOURCE_COMMIT" \
              --source-ref "$GITHUB_REF" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" >/dev/null
          done

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists" >&2
            exit 1
          fi
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$TAG" dist/* --verify-tag "${prerelease[@]}" --title "$TAG" --notes-file "docs/releases/v${VERSION}.md"
