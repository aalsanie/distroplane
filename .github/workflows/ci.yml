name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.1"

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Files require gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Verify module hygiene and zero dependency budget
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum

          mapfile -t modules < <(go list -m all)
          if [[ ${#modules[@]} -ne 1 || "${modules[0]}" != "github.com/aalsanie/distroplane" ]]; then
            printf 'P00 requires zero external Go modules. Found:\n%s\n' "${modules[*]}"
            exit 1
          fi

      - name: Verify private engineering context is not tracked
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files | grep -E '(^|/)\.codex(\.md)?$|(^|/)\.codex-context/|(^|/)AGENTS\.md$' || true)"
          if [[ -n "$tracked" ]]; then
            printf 'Private engineering-context files must not be tracked:\n%s\n' "$tracked"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Race tests
        run: go test -count=1 -race ./...

      - name: Enforce coverage
        shell: bash
        run: |
          set -euo pipefail
          threshold=90.0
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          go test -count=1 -covermode=atomic -coverprofile="$workdir/all.out" ./...
          total="$(go tool cover -func="$workdir/all.out" | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v got="$total" -v min="$threshold" 'BEGIN { if ((got + 0) < (min + 0)) { printf "repository coverage %.1f%% is below %.1f%%\n", got, min; exit 1 } }'

          while IFS= read -r package; do
            safe="${package//\//_}"
            profile="$workdir/$safe.out"
            go test -count=1 -covermode=atomic -coverprofile="$profile" "$package"

            # A profile containing only its mode line has no executable statements.
            if [[ $(wc -l < "$profile") -le 1 ]]; then
              continue
            fi

            coverage="$(go tool cover -func="$profile" | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
            awk -v pkg="$package" -v got="$coverage" -v min="$threshold" 'BEGIN { if ((got + 0) < (min + 0)) { printf "%s coverage %.1f%% is below %.1f%%\n", pkg, got, min; exit 1 } }'
          done < <(go list ./...)

          printf 'Repository coverage: %s%%\n' "$total"

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath ./cmd/distroplane
