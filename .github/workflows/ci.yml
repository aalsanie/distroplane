name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files require gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Check release notes
        run: |
          ./scripts/check-release-notes.sh
          ./scripts/test-release-notes.sh
      - name: Check published-asset-to-Homebrew formula generation
        shell: bash
        run: |
          python3 -m unittest discover -s scripts -p 'test_homebrew_formula.py'
          bash -n scripts/update-homebrew-tap.sh
      - name: Verify WinGet manifest generation and input validation
        run: python3 -m unittest discover -s scripts -p 'test_generate_winget_manifests.py' -v
      - name: Verify Linux installer failure and recovery paths
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p 'test_install_linux.py' -v
      - name: Vet
        run: go vet ./...
      - name: Dependency budget
        run: ./scripts/check-dependencies.sh
      - name: Architecture guard
        run: ./scripts/check-architecture.sh
      - name: Coverage
        run: ./scripts/check-coverage.sh
      - name: Race detector
        run: go test -race ./...
      - name: Module hygiene
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Canonical JSON
        run: go test ./internal/canonicaljson -run '^$' -fuzz '^FuzzNormalize$' -fuzztime 2s
      - name: Config
        run: go test ./internal/config -run '^$' -fuzz '^FuzzDecode$' -fuzztime 2s
      - name: Digests
        run: go test ./internal/domain -run '^$' -fuzz '^FuzzParseDigest$' -fuzztime 2s
      - name: Identifiers
        run: go test ./internal/domain -run '^$' -fuzz '^FuzzIdentifiers$' -fuzztime 2s
      - name: Journal frames
        run: go test ./internal/journal -run '^$' -fuzz '^FuzzRead$' -fuzztime 2s
      - name: Journal reducer
        run: go test ./internal/journal -run '^$' -fuzz '^FuzzReduce$' -fuzztime 2s

  linux-installer-arm64:
    name: Linux installer (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test direct Linux installer on ARM64
        run: python3 -m unittest discover -s scripts -p 'test_install_linux.py' -v

  benchmark:
    name: Benchmark record
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Record benchmark environment
        shell: bash
        run: |
          uname -a
          go version
          printf 'CPU: '
          lscpu | awk -F: '/Model name/ {gsub(/^ +/, "", $2); print $2; exit}'
      - name: CLI startup
        run: go test ./cmd/distroplane -run '^$' -bench '^BenchmarkColdProcessStartup$' -benchmem -benchtime=5x
      - name: Config parsing
        run: go test ./internal/config -run '^$' -bench '^BenchmarkDecodeConfig$' -benchmem -benchtime=20x
      - name: Planning and hashing
        run: go test ./internal/planner -run '^$' -bench '^(BenchmarkBuildTargets|BenchmarkFileHasher1MiB)$' -benchmem -benchtime=3x
      - name: Scheduling
        run: go test ./internal/executor -run '^$' -bench '^(BenchmarkSchedulerOneThousandOperations|BenchmarkSchedulerTenThousandOperations)$' -benchmem -benchtime=3x
      - name: Execution resource sample
        run: go test ./internal/executor -run '^$' -bench '^BenchmarkExecuteOneThousandOperationsPeakMemory$' -benchmem -benchtime=1x
      - name: Journal
        run: go test ./internal/journal -run '^$' -bench '^(BenchmarkWriterAppend|BenchmarkReadOneHundredThousandEvents|BenchmarkReduceOneHundredThousandEvents)$' -benchmem -benchtime=3x
      - name: Provider process startup
        run: go test ./internal/providerhost -run '^$' -bench '^BenchmarkProviderProcessStartup$' -benchmem -benchtime=5x
      - name: CLI workflow timings (isolated fixture)
        run: ./scripts/measure-cli-flow.sh

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Test
        run: go test ./...
      - name: Build native binaries
        run: |
          go build -trimpath ./cmd/distroplane
          go build -trimpath ./cmd/distroplane-provider-npm
          go build -trimpath ./cmd/distroplane-provider-sdkman
          go build -trimpath ./cmd/distroplane-provider-homebrew
          go build -trimpath ./cmd/distroplane-provider-winget

  homebrew-jvm-install:
    name: Homebrew JVM install (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install and run the Gradle-style application ZIP through Homebrew
        env:
          DISTROPLANE_BREW_JVM_INSTALL_TEST: '1'
        run: |
          brew --version
          java -version
          go test ./providers/homebrew -run '^TestHomebrewJVMDistributionInstallsAndRunsWithRuntimeJars$' -count=1 -v

  release-build:
    name: Release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BUILD_DATE: 1970-01-01T00:00:00Z
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Resolve release identity
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$') {
              throw "invalid VERSION: $version"
          }
          $commit = (git rev-parse --short=12 HEAD).Trim()
          "VERSION=$version" >> $env:GITHUB_ENV
          "COMMIT=$commit" >> $env:GITHUB_ENV
      - name: Build release artifacts
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/build.sh
      - name: Build release artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Verify release inventory and embedded executable integrity
        shell: pwsh
        run: |
          go run ./scripts/release-assets.go verify
          if ($LASTEXITCODE -ne 0) { throw 'release archive verification failed' }
      - name: Install and tamper-test unified archive on native Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          DISTROPLANE_RELEASE_SMOKE_DIR: ${{ github.workspace }}/dist
        run: bash scripts/smoke-linux-install.sh
      - name: Smoke candidate artifacts through CLI
        shell: pwsh
        env:
          DISTROPLANE_RELEASE_SMOKE_DIR: ${{ github.workspace }}/dist
        run: |
          $env:DISTROPLANE_RELEASE_SMOKE_VERSION = $env:VERSION
          $env:DISTROPLANE_RELEASE_SMOKE_COMMIT = $env:COMMIT
          go test ./cmd/distroplane -run '^TestReleaseArtifactsExecuteGitProviderThroughCLI$' -count=1
          if ($LASTEXITCODE -ne 0) { throw 'provider publication smoke failed' }
          go test ./scripts -run '^TestReleaseArchiveNativeExecutables$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'native archive executable smoke failed' }

  windows-msi:
    name: Windows MSI build and lifecycle (x64)
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install pinned WiX toolchain
        shell: pwsh
        run: |
          dotnet tool install --tool-path "$env:RUNNER_TEMP/wix" wix --version 6.0.0
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
      - name: Verify fail-closed Windows MSI signing policy
        shell: pwsh
        run: |
          $env:MSI_SIGNING_PFX_BASE64 = ''
          $env:MSI_SIGNING_PFX_PASSWORD = ''
          if ((./scripts/validate-windows-msi-mode.ps1 -Mode unsigned) -cne 'unsigned') {
            throw 'Unsigned mode must be explicitly accepted'
          }
          function Assert-Rejected([string]$mode) {
            try {
              ./scripts/validate-windows-msi-mode.ps1 -Mode $mode | Out-Null
              throw 'UNEXPECTED_POLICY_ACCEPTANCE'
            } catch {
              if ($_.Exception.Message -eq 'UNEXPECTED_POLICY_ACCEPTANCE') { throw }
            }
          }
          foreach ($mode in @('', 'false', 'pfx')) { Assert-Rejected $mode }
          $env:MSI_SIGNING_PFX_BASE64 = 'placeholder'
          $env:MSI_SIGNING_PFX_PASSWORD = 'placeholder'
          if ((./scripts/validate-windows-msi-mode.ps1 -Mode pfx) -cne 'pfx') {
            throw 'PFX mode must accept complete credentials'
          }
          Assert-Rejected 'unsigned'
          $env:MSI_SIGNING_PFX_PASSWORD = ''
          Assert-Rejected 'pfx'
          $env:MSI_SIGNING_PFX_BASE64 = ''
      - name: Build and verify Windows release input
        shell: pwsh
        env:
          BUILD_DATE: 1970-01-01T00:00:00Z
        run: |
          $env:VERSION = (Get-Content VERSION -Raw).Trim()
          $env:COMMIT = (git rev-parse --short=12 HEAD).Trim()
          ./scripts/build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          go run ./scripts/release-assets.go verify
          if ($LASTEXITCODE -ne 0) { throw 'Release integrity verification failed' }
          "VERSION=$env:VERSION" >> $env:GITHUB_ENV
      - name: Build both MSI architectures from verified release bytes
        shell: pwsh
        run: |
          $wix = Join-Path $env:RUNNER_TEMP 'wix/wix.exe'
          foreach ($arch in @('amd64', 'arm64')) {
            ./scripts/build-msi.ps1 -Version $env:VERSION -Architecture $arch -ReleaseDir dist -OutputDir msi -WixExe $wix
            $msi = "msi/distroplane_$($env:VERSION)_windows_$arch.msi"
            if ((Get-AuthenticodeSignature -LiteralPath $msi).Status -ne 'NotSigned') {
              throw "Unsigned CI MSI unexpectedly contains an Authenticode signature: $arch"
            }
          }
      - name: Generate WinGet manifest candidates from actual MSI hashes
        shell: pwsh
        run: |
          python scripts/generate-winget-manifests.py --version $env:VERSION --msi-dir msi --package-id Aalsanie.Distroplane --publisher Aalsanie --output-dir "$env:RUNNER_TEMP/winget-manifests"
          if ($LASTEXITCODE -ne 0) { throw 'WinGet manifest generation failed' }
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            # Hosted WinGet clients may predate schema 1.12 and warn on its URL; syntax errors still fail.
            winget validate --manifest "$env:RUNNER_TEMP/winget-manifests/a/Aalsanie/Distroplane/$env:VERSION" --ignore-warnings
            if ($LASTEXITCODE -ne 0) { throw 'WinGet manifest validation failed' }
          } else {
            Write-Host 'WinGet CLI unavailable on runner; structural validation only (public submission remains gated)'
          }
      - name: Build synthetic predecessor MSI for upgrade test
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'previous-msi'
          Expand-Archive -LiteralPath "dist/distroplane_$($env:VERSION)_windows_amd64.zip" -DestinationPath $stage
          & "$env:RUNNER_TEMP/wix/wix.exe" build packaging/windows/Product.wxs -arch x64 '-d' 'ProductVersion=0.0.1' '-d' 'UpgradeCode=708E3E44-72D8-4DC6-ACB9-FB5A7DD0A27E' '-d' "PayloadDir=$stage" -o 'msi/previous_amd64.msi'
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic upgrade fixture failed' }
          $armStage = Join-Path $env:RUNNER_TEMP 'previous-arm64-msi'
          Expand-Archive -LiteralPath "dist/distroplane_$($env:VERSION)_windows_arm64.zip" -DestinationPath $armStage
          & "$env:RUNNER_TEMP/wix/wix.exe" build packaging/windows/Product.wxs -arch arm64 '-d' 'ProductVersion=0.0.1' '-d' 'UpgradeCode=C937D854-AC1A-4966-9524-3927981DB7A6' '-d' "PayloadDir=$armStage" -o 'msi/previous_arm64.msi'
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic ARM upgrade fixture failed' }
      - name: Test native MSI installation, upgrade, providers and uninstall
        shell: pwsh
        run: |
          ./scripts/test-msi.ps1 -Version $env:VERSION -Architecture amd64 -Msi "msi/distroplane_$($env:VERSION)_windows_amd64.msi" -PreviousMsi 'msi/previous_amd64.msi'
      - name: Hand off Arm64 MSIs for native verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msi-arm64-candidate
          path: |
            msi/distroplane_*_windows_arm64.msi
            msi/previous_arm64.msi
          if-no-files-found: error
          retention-days: 1

  windows-msi-arm64:
    name: Windows MSI lifecycle (ARM64)
    needs: windows-msi
    runs-on: windows-11-arm
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download previously built ARM64 MSI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-msi-arm64-candidate
          path: msi
      - name: Test native ARM64 MSI installation, upgrade, providers and uninstall
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          ./scripts/test-msi.ps1 -Version $version -Architecture arm64 -Msi "msi/distroplane_${version}_windows_arm64.msi" -PreviousMsi 'msi/previous_arm64.msi'
