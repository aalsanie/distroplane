name: Distroplane
description: 'Plan and publish releases to npm, SDKMAN, Homebrew, and WinGet; reconcile pending work and export evidence.'
author: Distroplane

inputs:
  command:
    description: 'Distroplane command to run: plan, apply, reconcile, publish, or resume.'
    required: true
  version:
    description: 'Exact released Distroplane version, with optional leading v. Set explicitly when pinning the Action to a commit.'
    required: false
    default: ''
  repository:
    description: 'Repository containing Distroplane release assets.'
    required: false
    default: aalsanie/distroplane
  binary:
    description: 'Existing Distroplane binary to use instead of installing a release. Intended for development and smoke tests.'
    required: false
    default: ''
  approve:
    description: 'Explicitly authorize a new publication (publish only). Defaults to false.'
    required: false
    default: 'false'
  confirm-plan:
    description: 'Approve only the immutable plan ID specified here (publish only).'
    required: false
    default: ''
  release:
    description: 'Select an existing release for resume.'
    required: false
    default: ''
  reconcile-only:
    description: 'Run read-only reconciliation without apply during resume.'
    required: false
    default: 'false'
  upload-recovery:
    description: 'Upload an opt-in verified exact-workspace recovery bundle of the config, artifacts, plan, journal, and provider snapshots.'
    required: false
    default: 'false'
  restore-recovery:
    description: 'Restore and verify the recovery artifact before invoking Distroplane.'
    required: false
    default: 'false'
  recovery-artifact-name:
    description: 'Name used to upload or download an exact-workspace recovery bundle.'
    required: false
    default: distroplane-recovery
  install-providers:
    description: 'Install checksum-listed provider binaries for the resolved Distroplane release and add them to PATH.'
    required: false
    default: 'true'
  config:
    description: 'Path to distroplane.json.'
    required: false
    default: distroplane.json
  state-dir:
    description: 'State directory passed to the plan command.'
    required: false
    default: .distroplane
  plan:
    description: 'Immutable plan path required by apply and reconcile.'
    required: false
    default: ''
  upload-plan:
    description: 'Upload the generated immutable plan as a GitHub Actions artifact.'
    required: false
    default: 'false'
  plan-artifact-name:
    description: 'Artifact name used when upload-plan is true.'
    required: false
    default: distroplane-plan
  journal:
    description: 'Journal path required by apply and reconcile.'
    required: false
    default: .distroplane/run.journal
  run-id:
    description: 'Optional run ID for apply. Reconcile always uses the journal run ID.'
    required: false
    default: ''
  concurrency:
    description: 'Maximum concurrent operations for apply or reconcile. Zero uses the executor default.'
    required: false
    default: '0'
  credential-mappings:
    description: 'Multiline credential reference to environment-variable mappings in REF=ENV form.'
    required: false
    default: ''
  oidc:
    description: 'none (disabled), required (availability only), or npm (obtain a fresh npm-audience GitHub OIDC token for a trusted-publishing destination).'
    required: false
    default: none
  npm-oidc-ref:
    description: 'Exclusive credential reference of a single npm trusted-publishing destination. Required for oidc: npm.'
    required: false
    default: ''
  evidence-path:
    description: 'Optional path for a release evidence bundle after apply or reconcile.'
    required: false
    default: ''
  upload-evidence:
    description: 'Upload generated evidence as a GitHub Actions artifact.'
    required: false
    default: 'false'
  evidence-artifact-name:
    description: 'Artifact name used when upload-evidence is true.'
    required: false
    default: distroplane-evidence
  attestations:
    description: 'Optional multiline evidence attestation references in NAME=URI form.'
    required: false
    default: ''

outputs:
  plan-id:
    description: 'Plan ID returned by Distroplane.'
    value: ${{ steps.execute.outputs.plan-id }}
  plan-path:
    description: 'Persisted plan path returned by the plan command.'
    value: ${{ steps.execute.outputs.plan-path }}
  plan-artifact-id:
    description: 'GitHub Actions artifact ID for an uploaded plan.'
    value: ${{ steps.upload-plan.outputs.artifact-id }}
  plan-artifact-url:
    description: 'GitHub Actions URL for an uploaded plan.'
    value: ${{ steps.upload-plan.outputs.artifact-url }}
  plan-artifact-digest:
    description: 'GitHub Actions artifact digest for an uploaded plan.'
    value: ${{ steps.upload-plan.outputs.artifact-digest }}
  run-id:
    description: 'Run ID returned by apply or reconcile.'
    value: ${{ steps.execute.outputs.run-id }}
  state-path:
    description: 'Project-local Distroplane state root.'
    value: ${{ steps.execute.outputs.state-path }}
  journal-path:
    description: 'Durable journal path for a high-level publish.'
    value: ${{ steps.execute.outputs.journal-path }}
  failed:
    description: 'Whether Distroplane returned a failure exit code.'
    value: ${{ steps.execute.outputs.failed }}
  rejected:
    description: 'Whether Distroplane returned the rejected exit code.'
    value: ${{ steps.execute.outputs.rejected }}
  recovery-artifact-id:
    description: 'GitHub artifact ID for the verified recovery bundle.'
    value: ${{ steps.upload-recovery.outputs.artifact-id }}
  recovery-artifact-url:
    description: 'GitHub artifact URL for the verified recovery bundle.'
    value: ${{ steps.upload-recovery.outputs.artifact-url }}
  recovery-artifact-digest:
    description: 'GitHub artifact digest for the verified recovery bundle.'
    value: ${{ steps.upload-recovery.outputs.artifact-digest }}
  completed:
    description: 'Whether the run is complete.'
    value: ${{ steps.execute.outputs.completed }}
  pending:
    description: 'Whether Distroplane returned its normalized pending exit status.'
    value: ${{ steps.execute.outputs.pending }}
  exit-code:
    description: 'Native Distroplane command exit code.'
    value: ${{ steps.execute.outputs.exit-code }}
  result-json:
    description: 'Machine-readable JSON returned by the invoked Distroplane command.'
    value: ${{ steps.execute.outputs.result-json }}
  oidc-available:
    description: 'Whether GitHub exposed its native OIDC request environment to the action.'
    value: ${{ steps.execute.outputs.oidc-available }}
  evidence-path:
    description: 'Generated evidence bundle path, when requested.'
    value: ${{ steps.execute.outputs.evidence-path }}
  evidence-digest:
    description: 'SHA-256 digest of the generated evidence bundle.'
    value: ${{ steps.execute.outputs.evidence-digest }}
  evidence-artifact-id:
    description: 'GitHub Actions artifact ID for uploaded evidence.'
    value: ${{ steps.upload-evidence.outputs.artifact-id }}
  evidence-artifact-url:
    description: 'GitHub Actions URL for uploaded evidence.'
    value: ${{ steps.upload-evidence.outputs.artifact-url }}
  evidence-artifact-digest:
    description: 'GitHub Actions artifact digest for uploaded evidence.'
    value: ${{ steps.upload-evidence.outputs.artifact-digest }}

runs:
  using: composite
  steps:
    - name: Download recovery
      if: ${{ inputs.restore-recovery == 'true' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.recovery-artifact-name }}
        path: ${{ runner.temp }}/distroplane-recovery-restore

    - name: Verify and restore recovery
      if: ${{ inputs.restore-recovery == 'true' }}
      shell: pwsh
      run: |
        $python = if ($IsWindows) { 'python' } else { 'python3' }
        & $python "$env:GITHUB_ACTION_PATH/action/recovery.py" restore --workspace "$env:GITHUB_WORKSPACE" --bundle "$env:RUNNER_TEMP/distroplane-recovery-restore/recovery.zip"
        if ($LASTEXITCODE -ne 0) { throw 'Recovery verification failed; refusing to execute Distroplane.' }

    - name: Execute Distroplane
      id: execute
      shell: pwsh
      env:
        DISTROPLANE_ACTION_REF: ${{ github.action_ref }}
        DISTROPLANE_APPROVE: ${{ inputs.approve }}
        DISTROPLANE_CONFIRM_PLAN: ${{ inputs.confirm-plan }}
        DISTROPLANE_RELEASE: ${{ inputs.release }}
        DISTROPLANE_RECONCILE_ONLY: ${{ inputs.reconcile-only }}
        DISTROPLANE_ACTION_REPOSITORY: ${{ inputs.repository }}
        DISTROPLANE_ATTESTATIONS: ${{ inputs.attestations }}
        DISTROPLANE_BINARY: ${{ inputs.binary }}
        DISTROPLANE_COMMAND: ${{ inputs.command }}
        DISTROPLANE_CONCURRENCY: ${{ inputs.concurrency }}
        DISTROPLANE_CONFIG: ${{ inputs.config }}
        DISTROPLANE_CREDENTIAL_MAPPINGS: ${{ inputs.credential-mappings }}
        DISTROPLANE_EVIDENCE_PATH: ${{ inputs.evidence-path }}
        DISTROPLANE_INSTALL_PROVIDERS: ${{ inputs.install-providers }}
        DISTROPLANE_JOURNAL: ${{ inputs.journal }}
        DISTROPLANE_OIDC: ${{ inputs.oidc }}
        DISTROPLANE_NPM_OIDC_REF: ${{ inputs.npm-oidc-ref }}
        DISTROPLANE_PLAN: ${{ inputs.plan }}
        DISTROPLANE_RUN_ID: ${{ inputs.run-id }}
        DISTROPLANE_STATE_DIR: ${{ inputs.state-dir }}
        DISTROPLANE_UPLOAD_EVIDENCE: ${{ inputs.upload-evidence }}
        DISTROPLANE_VERSION: ${{ inputs.version }}
      run: '& "$env:GITHUB_ACTION_PATH/action/run.ps1"'

    - name: Prepare verified recovery bundle
      id: recovery
      if: ${{ always() && inputs.upload-recovery == 'true' && steps.execute.outcome == 'success' && steps.execute.outputs.plan-id != '' }}
      shell: pwsh
      env:
        RECOVERY_CONFIG: ${{ inputs.config }}
        RECOVERY_PLAN: ${{ steps.execute.outputs.plan-path }}
        RECOVERY_JOURNAL: ${{ steps.execute.outputs.journal-path }}
        RECOVERY_BINARY: ${{ inputs.binary }}
      run: |
        $python = if ($IsWindows) { 'python' } else { 'python3' }
        $path = Join-Path $env:RUNNER_TEMP 'distroplane-recovery-upload/recovery.zip'
        & $python "$env:GITHUB_ACTION_PATH/action/recovery.py" create --workspace "$env:GITHUB_WORKSPACE" --config "$env:RECOVERY_CONFIG" --plan "$env:RECOVERY_PLAN" --journal "$env:RECOVERY_JOURNAL" --binary "$env:RECOVERY_BINARY" --output "$path"
        if ($LASTEXITCODE -ne 0) { throw 'Failed to create verified recovery bundle.' }
        "path=$path" >> $env:GITHUB_OUTPUT

    - name: Upload recovery
      id: upload-recovery
      if: ${{ always() && steps.recovery.outcome == 'success' && steps.recovery.outputs.path != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.recovery-artifact-name }}
        path: ${{ steps.recovery.outputs.path }}
        if-no-files-found: error

    - name: Upload plan
      id: upload-plan
      if: ${{ always() && inputs.command == 'plan' && inputs.upload-plan == 'true' && steps.execute.outputs.plan-path != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.plan-artifact-name }}
        path: ${{ steps.execute.outputs.plan-path }}
        if-no-files-found: error

    - name: Upload evidence
      id: upload-evidence
      if: ${{ always() && inputs.upload-evidence == 'true' && steps.execute.outputs.evidence-path != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.evidence-artifact-name }}
        path: ${{ steps.execute.outputs.evidence-path }}
        if-no-files-found: error

    - name: Enforce Distroplane result
      if: ${{ always() && steps.execute.outcome == 'success' }}
      shell: pwsh
      env:
        DISTROPLANE_EXIT_CODE: ${{ steps.execute.outputs.exit-code }}
      run: |
        $code = [int]$env:DISTROPLANE_EXIT_CODE
        if ($code -eq 0) {
          exit 0
        }
        if ($code -eq 4) {
          Write-Host "::notice::Distroplane is waiting on external publication state; reconciliation can continue in a later job."
          exit 0
        }
        throw "Distroplane command failed with exit code $code."
